# Render's free plan puts the API to sleep after 15 minutes without traffic,
# which would also pause the lines/grading scheduler. This pings it every
# 10 minutes so it stays awake. Set the repository variable RENDER_URL
# (Settings > Secrets and variables > Actions > Variables) to your Render URL,
# e.g. https://callyourshot-api.onrender.com. Without it, this does nothing.
name: Keep API awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then echo "RENDER_URL not set; skipping."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$RENDER_URL/health"
